<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L.Y.V.R.A. Pet</title>
<link rel="stylesheet" href="/pet.css">
</head>
<body>
<main class="pet-shell" aria-live="polite">
  <section class="pet-card">
    <div class="pet-core" id="petCore" aria-label="L.Y.V.R.A. Pet Browser Surface">
      <div class="pet-heart">LYVRA</div>
    </div>
    <h1>L.Y.V.R.A. PET</h1>
    <p id="stateLabel">IDLE</p>
    <div class="controls">
      <button data-state="greeting">GREETING</button>
      <button data-state="fraggle">FRAGGLE</button>
      <button data-state="heart">HEART</button>
      <button data-state="music">MUSIC</button>
      <button data-state="thinking">THINKING</button>
      <button data-state="glitch">GLITCH</button>
      <button data-state="idle">IDLE</button>
    </div>
    <small>Browser surface only · no plugin binding · FREE_ONLY</small>
  </section>
</main>
<script src="/pet.js" defer></script>
</body>
</html>
