name: WEBLyvra R02 host compatibility — isolated candidate regression
on:
  push:
    branches: [lyvra]
    paths:
      - 'WEBLyvra/development/r02-host-compat/**'
      - '.github/workflows/weblyvra-r02-host-compat-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-host-focus-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install ephemeral DOM fixture dependency (CI only)
        run: npm install --prefix WEBLyvra/development/r02-host-compat --no-save --no-package-lock jsdom@26
      - name: Node R02 integration candidate and real DOM regression
        run: node --test WEBLyvra/development/r02-host-compat/*.test.mjs
