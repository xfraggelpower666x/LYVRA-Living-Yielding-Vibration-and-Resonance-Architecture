name: LYVRA Studio2 Semantic Handoff DEV
on:
  push:
    branches:
      - lyvra-dev-studio2-semantic-handoff-20261009
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scoped native Studio 2 handoff candidate
        run: node LYVRA_NATIVE_RUNTIME/continuity/development_exchange/verify-studio2-suno-handoff-proposal.mjs
