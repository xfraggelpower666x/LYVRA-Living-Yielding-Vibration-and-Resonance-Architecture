name: SCRI isolated regression (candidate only)
on:
  push:
    branches:
      - lyvra-scri-candidate-20261020
    paths:
      - '.github/workflows/scri-isolated-regression.yml'
      - 'LYVRA_NATIVE_RUNTIME/development/scri_*_20261020.py'
      - 'LYVRA_NATIVE_RUNTIME/development/test_scri_*_20261020.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scri-fixture-regression:
    if: github.ref == 'refs/heads/lyvra-scri-candidate-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: LYVRA_NATIVE_RUNTIME/development
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python version
        run: python3 --version
      - name: Compile all SCRI fixture modules
        run: python3 -m compileall -q scri_hypothesis_probe_20261020.py scri_causal_experience_probe_20261020.py scri_diagnostic_reflection_20261020.py scri_context_reconstruction_20261020.py scri_evidence_hardening_20261020.py scri_integrated_chain_20261020.py test_scri_competing_experiences_20261020.py test_scri_evidence_hardening_20261020.py test_scri_integrated_chain_20261020.py scri_github_evidence_adapter_20261020.py test_scri_github_evidence_adapter_20261020.py test_scri_real_git_provenance_20261021.py test_scri_recovery_anchor_20261021.py scri_recovery_ring_20261021.py test_scri_recovery_ring_20261021.py scri_ref_stability_20261021.py test_scri_ref_stability_20261021.py scri_lkg_protection_audit_20261021.py test_scri_lkg_protection_audit_20261021.py scri_temporal_provenance_20261021.py test_scri_temporal_provenance_20261021.py test_scri_real_supersession_20261021.py scri_causal_carrier_chain_20261021.py test_scri_causal_carrier_chain_20261021.py
      - name: Four standalone legacy fixtures
        run: |
          set -euo pipefail
          python3 scri_hypothesis_probe_20261020.py
          python3 scri_causal_experience_probe_20261020.py
          python3 scri_diagnostic_reflection_20261020.py
          python3 scri_context_reconstruction_20261020.py
      - name: Competing experiences regressions
        run: python3 -m unittest -v test_scri_competing_experiences_20261020.py
      - name: Evidence hardening regressions
        run: python3 -m unittest -v test_scri_evidence_hardening_20261020.py
      - name: End-to-end integrated regressions
        run: python3 -m unittest -v test_scri_integrated_chain_20261020.py
      - name: GitHub evidence adapter regressions
        run: python3 -m unittest -v test_scri_github_evidence_adapter_20261020.py
      - name: Live git object provenance regressions
        run: python3 -m unittest -v test_scri_real_git_provenance_20261021.py
      - name: Read-only real recovery anchor acceptance
        run: python3 -m unittest -v test_scri_recovery_anchor_20261021.py
      - name: Ten-slot recovery ring preservation suite
        run: python3 -m unittest -v test_scri_recovery_ring_20261021.py
      - name: Ref ABA and live Git acceptance
        run: python3 -m unittest -v test_scri_ref_stability_20261021.py
      - name: LKG protection and evolution evidence suite
        run: python3 -m unittest -v test_scri_lkg_protection_audit_20261021.py
      - name: Temporal provenance and real repeated Git ref sampling
        run: python3 -m unittest -v test_scri_temporal_provenance_20261021.py
      - name: Real productive supersession and handoff readback
        run: python3 -m unittest -v test_scri_real_supersession_20261021.py
      - name: Three-facet real causal carrier chain acceptance
        run: python3 -m unittest -v test_scri_causal_carrier_chain_20261021.py
      - name: Summary
        run: echo "87 fixture checks plus 9 real git-object and 9 recovery-anchor checks and 18 read-only ring and 12 ref stability and 17 LKG-protection and 13 temporal provenance and 15 real supersession and 15 causal carrier checks defined; PASS requires all previous steps success. Synthetic evidence, not live SCRI runtime."
