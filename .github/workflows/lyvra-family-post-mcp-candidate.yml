name: LYVRA Family Post MCP candidate source checks

on:
  pull_request:
    paths:
      - 'family_post_bridge/mcp_runtime_candidate.py'
      - 'family_post_bridge/mcp_gateway.py'
      - 'family_post_bridge/mcp_writer_adapter.py'
      - 'family_post_bridge/tests/test_mcp_runtime_candidate_source.py'
      - '.github/workflows/lyvra-family-post-mcp-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-only candidate
        run: python -m py_compile family_post_bridge/mcp_runtime_candidate.py family_post_bridge/tests/test_mcp_runtime_candidate_source.py
      - name: Source no-network boundary tests
        run: python -m unittest -v family_post_bridge.tests.test_mcp_runtime_candidate_source
