name: LYVRA Family Post MCP candidate source checks

on:
  pull_request:
    paths:
      - 'family_post_bridge/mcp_runtime_candidate.py'
      - 'family_post_bridge/mcp_gateway.py'
      - 'family_post_bridge/mcp_writer_adapter.py'
      - 'family_post_bridge/tests/test_mcp_runtime_candidate_source.py'
      - 'family_post_bridge/tests/test_mcp_runtime_asgi.py'
      - 'family_post_bridge/delivery_orchestrator_candidate.py'
      - 'family_post_bridge/tests/test_delivery_orchestrator_candidate.py'
      - 'family_post_bridge/receipt_finalization_candidate.py'
      - 'family_post_bridge/tests/test_receipt_finalization_candidate.py'
      - 'family_post_bridge/commit_recovery_candidate.py'
      - 'family_post_bridge/tests/test_commit_recovery_candidate.py'
      - 'family_post_bridge/tests/test_postgres_registry_integration.py'
      - 'family_post_bridge/durable_registry_candidate.py'
      - 'family_post_bridge/schema/durable_registry_candidate.sql'
      - 'family_post_bridge/tests/test_durable_registry_candidate.py'
      - 'family_post_bridge/durable_admission_policy.py'
      - 'family_post_bridge/tests/test_durable_admission_policy.py'
      - '.github/workflows/lyvra-family-post-mcp-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-only candidate
        run: python -m py_compile family_post_bridge/mcp_runtime_candidate.py family_post_bridge/tests/test_mcp_runtime_candidate_source.py family_post_bridge/durable_admission_policy.py family_post_bridge/tests/test_durable_admission_policy.py family_post_bridge/durable_registry_candidate.py family_post_bridge/tests/test_durable_registry_candidate.py family_post_bridge/commit_recovery_candidate.py family_post_bridge/tests/test_commit_recovery_candidate.py family_post_bridge/receipt_finalization_candidate.py family_post_bridge/tests/test_receipt_finalization_candidate.py family_post_bridge/delivery_orchestrator_candidate.py family_post_bridge/tests/test_delivery_orchestrator_candidate.py
      - name: Source no-network boundary tests
        run: python -m unittest -v family_post_bridge.tests.test_mcp_runtime_candidate_source family_post_bridge.tests.test_durable_admission_policy family_post_bridge.tests.test_durable_registry_candidate family_post_bridge.tests.test_commit_recovery_candidate family_post_bridge.tests.test_receipt_finalization_candidate family_post_bridge.tests.test_delivery_orchestrator_candidate

  asgi-runtime-negative-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned MCP and service requirements
        run: pip install -r family_post_bridge/requirements.txt -r family_post_bridge/requirements-mcp-dev.txt 'httpx>=0.27,<1'
      - name: In-process ASGI lifespan and role authorization negatives
        run: python -m unittest -v family_post_bridge.tests.test_mcp_runtime_asgi

  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lyvra_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: family_post_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lyvra_test -d family_post_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FAMILY_POST_TEST_PG_DSN: postgresql://lyvra_test:synthetic_ci_only@localhost:5432/family_post_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated PostgreSQL driver
        run: pip install 'psycopg[binary]>=3.2,<4'
      - name: Real atomic uniqueness and reconnect tests (no Drive)
        run: python -m unittest -v family_post_bridge.tests.test_postgres_registry_integration
