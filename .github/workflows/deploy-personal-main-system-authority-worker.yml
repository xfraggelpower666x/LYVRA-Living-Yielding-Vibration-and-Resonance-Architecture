name: Deploy Personal Main-System Authority Worker

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or ref containing the staged Worker
        required: true
        default: worker-v2-main-system-authority
        type: string

permissions:
  contents: read

concurrency:
  group: personal-main-system-authority-worker-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staged Worker source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Verify staged Worker source and Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          test -f cloudflare-workers/personal-main-system-authority/worker.js
          test -f cloudflare-workers/personal-main-system-authority/wrangler.toml
          node --check cloudflare-workers/personal-main-system-authority/worker.js
          grep -F 'name = "666-main-system-authority-evidence"' cloudflare-workers/personal-main-system-authority/wrangler.toml
          grep -F 'WORKER_SCOPE = "MAIN_PERSONAL_ONLY"' cloudflare-workers/personal-main-system-authority/wrangler.toml
          grep -F 'PORTABLE_WORKER_BINDING = "DISABLED"' cloudflare-workers/personal-main-system-authority/wrangler.toml

      - name: Deploy through GitHub Actions Wrangler path
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-workers/personal-main-system-authority
          wranglerVersion: "4.111.0"
          command: deploy
