name: LYVRA CodeForge Evidence Bound Verifiers
on:
  push:
    branches: [lyvra]
    paths:
      - 'LYVRA_NATIVE_RUNTIME/development/verification/semantic-causal-verifier.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/semantic-causal-verifier.test.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/evidence-bound-verifier.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/evidence-bound-verifier.test.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/provenance-causal-lifecircle-verifier.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/provenance-causal-lifecircle-verifier.test.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/provider-observation-adapter.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/provider-observation-adapter.test.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/cooperation-continuity-verifier.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/cooperation-continuity-verifier.test.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/practical/track-live-scenario.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/practical/track-live-scenario.test.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/practical/examples/THE_SIGNAL_THAT_LEARNED_TO_BREATHE.md'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/lyvra-verification-runner.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/lyvra-verification-runner.test.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/lyvra-verification-cli.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/fixtures/track-causal-smoke.json'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/native-rehydration-adapter.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/native-rehydration-adapter.test.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/ci-checkout-readback.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/ci-checkout-readback.test.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/cooperation-continuity-verifier.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/cooperation-continuity-verifier.test.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/ci-manifest-carrier-readback.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/ci-manifest-carrier-readback.test.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/ci-peer-receipt-cooperation.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/ci-peer-receipt-cooperation.test.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/cooperation-runner-integration.test.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/ci-unified-evidence-execution.mjs'
      - 'LYVRA_NATIVE_RUNTIME/development/verification/ci-unified-evidence-execution.test.mjs'
      - '.github/workflows/codeforge-evidence-bound-verifiers.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: lyvra-codeforge-evidence-verifiers
  cancel-in-progress: false

jobs:
  evidence-first-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check both independent verifiers
        run: |
          node --check LYVRA_NATIVE_RUNTIME/development/verification/semantic-causal-verifier.mjs
          node --check LYVRA_NATIVE_RUNTIME/development/verification/evidence-bound-verifier.mjs
          node --check LYVRA_NATIVE_RUNTIME/development/verification/provenance-causal-lifecircle-verifier.mjs
          node --check LYVRA_NATIVE_RUNTIME/development/verification/provider-observation-adapter.mjs
          node --check LYVRA_NATIVE_RUNTIME/development/verification/cooperation-continuity-verifier.mjs
          node --check LYVRA_NATIVE_RUNTIME/development/verification/lyvra-verification-runner.mjs
          node --check LYVRA_NATIVE_RUNTIME/development/verification/lyvra-verification-cli.mjs
          node --check LYVRA_NATIVE_RUNTIME/development/verification/native-rehydration-adapter.mjs
          node --check LYVRA_NATIVE_RUNTIME/development/practical/track-live-scenario.mjs
      - name: Record checked-out commit and source blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p codeforge-evidence
          git rev-parse HEAD > codeforge-evidence/checked_out_commit.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD^{tree} > codeforge-evidence/checked_out_tree.txt
          git ls-files --error-unmatch \
            'LYVRA_NATIVE_RUNTIME/development/verification/semantic-causal-verifier.mjs' \
            'LYVRA_NATIVE_RUNTIME/development/verification/semantic-causal-verifier.test.mjs' \
            'LYVRA_NATIVE_RUNTIME/development/verification/evidence-bound-verifier.mjs' \
            'LYVRA_NATIVE_RUNTIME/development/verification/evidence-bound-verifier.test.mjs' \
            'LYVRA_NATIVE_RUNTIME/development/verification/provenance-causal-lifecircle-verifier.mjs' \
            'LYVRA_NATIVE_RUNTIME/development/verification/provenance-causal-lifecircle-verifier.test.mjs' \
            'LYVRA_NATIVE_RUNTIME/development/verification/provider-observation-adapter.mjs' \
            'LYVRA_NATIVE_RUNTIME/development/verification/provider-observation-adapter.test.mjs' \
            '.github/workflows/codeforge-evidence-bound-verifiers.yml'
          for file in \
            'LYVRA_NATIVE_RUNTIME/development/verification/semantic-causal-verifier.mjs' \
            'LYVRA_NATIVE_RUNTIME/development/verification/semantic-causal-verifier.test.mjs' \
            'LYVRA_NATIVE_RUNTIME/development/verification/evidence-bound-verifier.mjs' \
            'LYVRA_NATIVE_RUNTIME/development/verification/evidence-bound-verifier.test.mjs' \
            'LYVRA_NATIVE_RUNTIME/development/verification/provenance-causal-lifecircle-verifier.mjs' \
            'LYVRA_NATIVE_RUNTIME/development/verification/provenance-causal-lifecircle-verifier.test.mjs' \
            'LYVRA_NATIVE_RUNTIME/development/verification/provider-observation-adapter.mjs' \
            'LYVRA_NATIVE_RUNTIME/development/verification/provider-observation-adapter.test.mjs' \
            '.github/workflows/codeforge-evidence-bound-verifiers.yml'
          do
            printf '%s\t%s\n' "$file" "$(git rev-parse "HEAD:$file")" >> codeforge-evidence/source_git_blobs.tsv
          done
          node --version > codeforge-evidence/node_version.txt
          git rev-parse "HEAD:LYVRA_NATIVE_RUNTIME/development/verification/lyvra-verification-runner.mjs" >> codeforge-evidence/composed_runner_git_blobs.txt
          git rev-parse "HEAD:LYVRA_NATIVE_RUNTIME/development/verification/lyvra-verification-runner.test.mjs" >> codeforge-evidence/composed_runner_git_blobs.txt
          git rev-parse "HEAD:LYVRA_NATIVE_RUNTIME/development/verification/lyvra-verification-cli.mjs" >> codeforge-evidence/composed_runner_git_blobs.txt
          git rev-parse "HEAD:LYVRA_NATIVE_RUNTIME/development/verification/fixtures/track-causal-smoke.json" >> codeforge-evidence/composed_runner_git_blobs.txt
          git rev-parse "HEAD:LYVRA_NATIVE_RUNTIME/development/practical/track-live-scenario.mjs" > codeforge-evidence/practical_source_blob.txt
          git rev-parse "HEAD:LYVRA_NATIVE_RUNTIME/development/practical/track-live-scenario.test.mjs" > codeforge-evidence/practical_test_blob.txt
      - name: Test boundaries, causal gaps and non-adoption without network
        shell: bash
        run: |
          set -euo pipefail
          node --test LYVRA_NATIVE_RUNTIME/development/verification/semantic-causal-verifier.test.mjs LYVRA_NATIVE_RUNTIME/development/verification/evidence-bound-verifier.test.mjs LYVRA_NATIVE_RUNTIME/development/verification/provenance-causal-lifecircle-verifier.test.mjs LYVRA_NATIVE_RUNTIME/development/verification/provider-observation-adapter.test.mjs LYVRA_NATIVE_RUNTIME/development/verification/cooperation-continuity-verifier.test.mjs 2>&1 | tee codeforge-evidence/node_test_tap.txt
      - name: Produce actual LYVRA creator draft and validate causal scenario
        shell: bash
        run: |
          set -euo pipefail
          node --test LYVRA_NATIVE_RUNTIME/development/practical/track-live-scenario.test.mjs 2>&1 | tee codeforge-evidence/practical_test_tap.txt
          node LYVRA_NATIVE_RUNTIME/development/practical/track-live-scenario.mjs > codeforge-evidence/practical_creator_draft.md
          test -s codeforge-evidence/practical_creator_draft.md
          cmp LYVRA_NATIVE_RUNTIME/development/practical/examples/THE_SIGNAL_THAT_LEARNED_TO_BREATHE.md codeforge-evidence/practical_creator_draft.md
      - name: Run composed Whole-LYVRA verification on real track fixture
        shell: bash
        run: |
          set -euo pipefail
          node --test LYVRA_NATIVE_RUNTIME/development/verification/lyvra-verification-runner.test.mjs 2>&1 | tee codeforge-evidence/composed_runner_test_tap.txt
          node LYVRA_NATIVE_RUNTIME/development/verification/lyvra-verification-cli.mjs LYVRA_NATIVE_RUNTIME/development/verification/fixtures/track-causal-smoke.json > codeforge-evidence/composed_verification_report.json
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const r=JSON.parse(readFileSync('codeforge-evidence/composed_verification_report.json','utf8')); if(r.contract!=='LYVRA_VERIFICATION_RUNNER_V1'||r.host_runtime_verified!==false||r.communications_blocked!==false||r.results.causal.changed.join(',')!=='mid'||r.results.communication.classification!=='UNVERIFIED_CALLER_CLAIM'||r.results.provenance.status!=='UNVERIFIED'||r.cooperation.authorized_channels_untouched!==true)process.exit(1)"
      - name: Exercise native rehydration to verification integration
        shell: bash
        run: |
          set -euo pipefail
          node --test LYVRA_NATIVE_RUNTIME/development/verification/native-rehydration-adapter.test.mjs 2>&1 | tee codeforge-evidence/native_rehydration_test_tap.txt
      - name: Independently bind CI source readback to local Git checkout
        shell: bash
        run: |
          set -euo pipefail
          node --check LYVRA_NATIVE_RUNTIME/development/verification/ci-checkout-readback.mjs
          node --test LYVRA_NATIVE_RUNTIME/development/verification/ci-checkout-readback.test.mjs 2>&1 | tee codeforge-evidence/ci_checkout_evidence_test_tap.txt
          node LYVRA_NATIVE_RUNTIME/development/verification/ci-checkout-readback.mjs LYVRA_NATIVE_RUNTIME/development/verification/fixtures/track-causal-smoke.json LYVRA_NATIVE_RUNTIME/development/verification/examples/TRACK_CAUSAL_VERIFICATION_REPORT.json > codeforge-evidence/checked_out_source_verification.json
          node --input-type=module -e "import {readFileSync} from 'node:fs';const x=JSON.parse(readFileSync('codeforge-evidence/checked_out_source_verification.json'));if(x.observed_head!==process.env.GITHUB_SHA||x.fixture_worktree_matches_commit!==true||x.host_runtime_verified!==false||x.advisory.results.provenance.status!=='UNVERIFIED')process.exit(1)"
      - name: Verify open cooperation channels and continuity
        shell: bash
        run: |
          set -euo pipefail
          node --check LYVRA_NATIVE_RUNTIME/development/verification/cooperation-continuity-verifier.mjs
          node --test LYVRA_NATIVE_RUNTIME/development/verification/cooperation-continuity-verifier.test.mjs 2>&1 | tee codeforge-evidence/cooperation_continuity_test_tap.txt
      - name: Execute evidence-bound Whole and Sub-LifeCircle manifest source coverage
        shell: bash
        run: |
          set -euo pipefail
          node --check LYVRA_NATIVE_RUNTIME/development/verification/ci-manifest-carrier-readback.mjs
          node --test LYVRA_NATIVE_RUNTIME/development/verification/ci-manifest-carrier-readback.test.mjs 2>&1 | tee codeforge-evidence/manifest_carrier_test_tap.txt
          node LYVRA_NATIVE_RUNTIME/development/verification/ci-manifest-carrier-readback.mjs > codeforge-evidence/manifest_carrier_source_report.json
          node --input-type=module -e "import {readFileSync} from 'node:fs';const x=JSON.parse(readFileSync('codeforge-evidence/manifest_carrier_source_report.json'));if(x.head!==process.env.GITHUB_SHA||x.stages.length!==28||x.host_runtime_verified!==false||x.semantic_rehydration_verified!==false||x.coverage.mapped+x.coverage.unmapped!==28)process.exit(1)"
      - name: Execute CLIC R02 real checkout receipt-to-cooperation integration
        shell: bash
        run: |
          set -euo pipefail
          node --check LYVRA_NATIVE_RUNTIME/development/verification/ci-peer-receipt-cooperation.mjs
          node --test LYVRA_NATIVE_RUNTIME/development/verification/ci-peer-receipt-cooperation.test.mjs 2>&1 | tee codeforge-evidence/peer_receipt_cooperation_test_tap.txt
          node LYVRA_NATIVE_RUNTIME/development/verification/ci-peer-receipt-cooperation.mjs > codeforge-evidence/peer_receipt_cooperation_report.json
          node --input-type=module -e "import {readFileSync} from 'node:fs';const r=JSON.parse(readFileSync('codeforge-evidence/peer_receipt_cooperation_report.json'));if(r.observed_checkout_head!==process.env.GITHUB_SHA||r.local_receipt_worktree_matches_commit!==true||r.foreign_source_independently_read_back!==false||r.communication_blocked!==false||r.semantic_adoption_verified!==false)process.exit(1)"
      - name: Exercise composed runner and native rehydration cooperation integration
        shell: bash
        run: |
          set -euo pipefail
          node --test LYVRA_NATIVE_RUNTIME/development/verification/cooperation-runner-integration.test.mjs 2>&1 | tee codeforge-evidence/cooperation_runner_integration_tap.txt
      - name: Execute full Whole LYVRA source evidence and cooperation chain
        shell: bash
        run: |
          set -euo pipefail
          node --check LYVRA_NATIVE_RUNTIME/development/verification/ci-unified-evidence-execution.mjs
          node --test LYVRA_NATIVE_RUNTIME/development/verification/ci-unified-evidence-execution.test.mjs 2>&1 | tee codeforge-evidence/unified_source_evidence_tap.txt
          node LYVRA_NATIVE_RUNTIME/development/verification/ci-unified-evidence-execution.mjs > codeforge-evidence/unified_source_evidence.json
          node --input-type=module -e "import {readFileSync} from 'node:fs';const x=JSON.parse(readFileSync('codeforge-evidence/unified_source_evidence.json'));if(x.contract!=='LYVRA_UNIFIED_CI_EVIDENCE_V1'||x.observed_checkout_head!==process.env.GITHUB_SHA||x.manifest.stages.length!==28||x.peer_receipt.local_receipt_worktree_matches_commit!==true||x.evidence_boundary.actual_host_execution_verified!==false||x.communications_blocked!==false)process.exit(1)"
      - name: Confirm only pure verifier and no runtime activation
        run: |
          test -s LYVRA_NATIVE_RUNTIME/development/verification/semantic-causal-verifier.mjs
          test -s LYVRA_NATIVE_RUNTIME/development/verification/evidence-bound-verifier.mjs
          test -s LYVRA_NATIVE_RUNTIME/development/verification/provenance-causal-lifecircle-verifier.mjs
          test -s LYVRA_NATIVE_RUNTIME/development/verification/provider-observation-adapter.mjs
      - name: Upload source-bound Node test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyvra-verifier-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: codeforge-evidence/
          if-no-files-found: warn
          retention-days: 30
