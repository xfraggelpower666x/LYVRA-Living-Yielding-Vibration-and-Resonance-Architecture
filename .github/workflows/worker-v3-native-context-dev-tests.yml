name: LYVRA Worker v3 Standalone Development Security Tests
on:
  push:
    branches:
      - worker-v3-native-context-dev-20261004
    paths:
      - "cloudflare-workers/personal-main-system-authority/**"
      - ".github/workflows/worker-v3-native-context-dev-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
# CREATOR ZERO-ADDITIONAL-COST GUARD (2026-10-05):
# NO Cloudflare API writes, deployments, paid plans, paid products or live resources.
# Dry-run and 127.0.0.1-local Wrangler use only; artifacts retained 7 days.
# Do not add Cloudflare credentials to this workflow.
jobs:
  offline-v3:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ""
      CLOUDFLARE_ACCOUNT_ID: ""
      WRANGLER_SEND_METRICS: "false"
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce no Cloudflare writes or remote Wrangler in offline CI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          wf=Path(".github/workflows/worker-v3-native-context-dev-tests.yml").read_text()
          lines=wf.splitlines()
          assert 'CLOUDFLARE_API_TOKEN: ""' in wf and 'CLOUDFLARE_ACCOUNT_ID: ""' in wf
          for line in lines:
              t=line.strip()
              if t.startswith("- uses:") and ("cloudflare/" in t or "wrangler-action" in t):
                  raise AssertionError("Cloudflare deploy action forbidden")
              if t.startswith(("npx ", "wrangler ", "pnpm ", "npm exec ")):
                  if re.search(r'\\bwrangler(?:@[^ ]+)?\\s+(?:deploy|publish)\\b',t):
                      assert "--dry-run" in t, f"Remote deploy forbidden: {t}"
                  if re.search(r'\\bwrangler(?:@[^ ]+)?\\s+dev\\b',t):
                      assert "--local" in t and "--ip 127.0.0.1" in t, f"Remote dev forbidden: {t}"
          print("ZERO_ADDITIONAL_CLOUDFLARE_COST_OFFLINE_CI_FENCE=PASS")
          PY
      - name: Syntax Worker entry and legacy main
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-workers/personal-main-system-authority
          node --input-type=module --check < worker.js
          node --input-type=module --check < worker-runtime-adapter.js
          for js in worker-native-context.mjs worker-native-v3.mjs worker-v3-route.mjs worker-v3-do.mjs; do node --check "$js"; done
          grep -Fx 'name = "lyvrasystem"' wrangler.toml
          grep -Fx 'main = "worker-runtime-adapter.js"' wrangler.toml
          grep -F 'WORKER_SCOPE = "MAIN_PERSONAL_ONLY"' wrangler.toml
          grep -F 'PORTABLE_WORKER_BINDING = "DISABLED"' wrangler.toml
      - name: Native v3 mocked issue/verify/DO replay regression
        shell: bash
        run: node --test cloudflare-workers/personal-main-system-authority/worker-v3-route.test.mjs
      - name: Ensure native v1/v2 and Wrangler remain identical to current Worker staging
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin worker-v2-main-system-authority:refs/remotes/origin/worker-v2-main-system-authority
          git diff --exit-code origin/worker-v2-main-system-authority -- \
            cloudflare-workers/personal-main-system-authority/worker.js \
            cloudflare-workers/personal-main-system-authority/wrangler.toml
          echo "LEGACY_WORKER_AND_WRANGLER_UNCHANGED=PASS"
      - name: Assert migration stays disabled
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq '^NATIVE_V3_ENABLED[[:space:]]*=[[:space:]]*"true"' cloudflare-workers/personal-main-system-authority/wrangler.toml
          ! grep -Eq '^\[\[durable_objects.bindings\]\]' cloudflare-workers/personal-main-system-authority/wrangler.toml
          ! grep -Eq '^\\[\\[migrations\\]\\]|new_sqlite_classes|NATIVE_V3_NONCES|sqlite' cloudflare-workers/personal-main-system-authority/wrangler.toml
          # Legacy routes remain operable without any v3/nonces/storage binding.
          node --input-type=module - <<'JS'
          import {handleNativeV3Route} from './cloudflare-workers/personal-main-system-authority/worker-v3-route.mjs';
          const req=new Request('https://worker.invalid/v3/native-evidence',{method:'POST',body:'{}'});
          const res=await handleNativeV3Route(req,{});
          if(res.status!==404 || (await res.json()).state!=='V3_DISABLED') process.exit(1);
          console.log('OPTIONAL_V3=DISABLED; SQLITE_BINDING=NOT_REQUIRED');
          JS
          echo "V3_DEPLOYMENT=NOT_ACTIVATED"

      - name: Bundle existing lyvrasystem worker with Wrangler without deployment
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          cd cloudflare-workers/personal-main-system-authority
          npx --yes wrangler@4.111.0 deploy --dry-run --outdir=/tmp/lyvra-v3-wrangler-build
          test -d /tmp/lyvra-v3-wrangler-build
          if grep -R -E 'NATIVE_V3_ENABLED[[:space:]]*=[[:space:]]*"true"' wrangler.toml; then
            echo "::error::V3 deployment was unexpectedly activated in config."
            exit 1
          fi
          echo "WRANGLER_BUNDLE_DRY_RUN=PASS; DEPLOYMENT=FALSE"

      - name: Build isolated v3 staging release bundle without deploy
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          cd cloudflare-workers/personal-main-system-authority
          cat > .wrangler-v3-staging-ci.toml <<'TOML'
          name = "lyvrasystem-v3-staging"
          main = "worker-runtime-adapter.js"
          compatibility_date = "2026-04-09"
          workers_dev = false
          [vars]
          WORKER_SCOPE = "MAIN_PERSONAL_ONLY"
          PORTABLE_WORKER_BINDING = "DISABLED"
          NATIVE_V3_ENABLED = "true"
          [[durable_objects.bindings]]
          name = "NATIVE_V3_NONCES"
          class_name = "NativeV3NonceGate"
          [[migrations]]
          tag = "lyvra-v3-staging-sqlite-v1"
          new_sqlite_classes = ["NativeV3NonceGate"]
          TOML
          trap 'rm -f .wrangler-v3-staging-ci.toml' EXIT
          ! grep -q 'name = "lyvrasystem"' .wrangler-v3-staging-ci.toml
          npx --yes wrangler@4.111.0 deploy --dry-run --config .wrangler-v3-staging-ci.toml --outdir=/tmp/lyvra-v3-staging-bundle
          test -d /tmp/lyvra-v3-staging-bundle
          test -n "$(find /tmp/lyvra-v3-staging-bundle -type f -print -quit)"
          echo "ISOLATED_STAGING_BUNDLE=PASS; PRODUCTION_UNTOUCHED=TRUE; DEPLOYMENT=FALSE"

      - name: Preserve isolated staging bundle as CI artifact (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: lyvrasystem-v3-staging-bundle-${{ github.sha }}
          path: /tmp/lyvra-v3-staging-bundle/
          if-no-files-found: error
          retention-days: 7

      - name: Isolated loopback Wrangler SQLite Durable Object integration (never deploy)
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-workers/personal-main-system-authority
          test ! -e .dev.vars
          CLIENT="$(openssl rand -hex 40)"
          TICKET="$(openssl rand -hex 40)"
          export CI_NATIVE_V3_CLIENT_SECRET="$CLIENT"
          printf 'NATIVE_V3_CLIENT_SECRET=%s\nNATIVE_V3_TICKET_SECRET=%s\n' "$CLIENT" "$TICKET" > .dev.vars
          cat > .wrangler-v3-ci.toml <<'TOML'
          name = "lyvrasystem-v3-ci-local-only"
          main = "worker-runtime-adapter.js"
          compatibility_date = "2026-04-09"
          workers_dev = false
          [vars]
          WORKER_SCOPE = "MAIN_PERSONAL_ONLY"
          PORTABLE_WORKER_BINDING = "DISABLED"
          NATIVE_V3_ENABLED = "true"
          [[durable_objects.bindings]]
          name = "NATIVE_V3_NONCES"
          class_name = "NativeV3NonceGate"
          [[migrations]]
          tag = "ci-new-sqlite-nonce-gate"
          new_sqlite_classes = ["NativeV3NonceGate"]
          TOML
          cleanup() {
            if [[ -n "${SERVER_PID:-}" ]]; then kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true; fi
            rm -f .dev.vars .wrangler-v3-ci.toml
          }
          trap cleanup EXIT
          npx --yes wrangler@4.111.0 dev --local --config .wrangler-v3-ci.toml --ip 127.0.0.1 --port 8789 > /tmp/lyvra-v3-local-test.log 2>&1 &
          SERVER_PID=$!
          ready=false
          for i in $(seq 1 35); do
            if curl --silent --fail --max-time 1 http://127.0.0.1:8789/health >/dev/null; then ready=true; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::Local-only Wrangler DO worker did not start"
            tail -n 45 /tmp/lyvra-v3-local-test.log
            exit 1
          fi
          node worker-v3-local-smoke.mjs
          echo "LOCAL_DURABLE_OBJECT_INTEGRATION=PASS; NO_DEPLOYMENT=TRUE"
