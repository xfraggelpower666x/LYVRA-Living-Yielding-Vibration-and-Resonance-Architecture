name: Pet DEV native regression
on:
  push:
    branches:
      - lyvra-dev-pet-auto-facet-repair-20261009
    paths:
      - 'LYVRA_PET/**'
      - '.github/workflows/pet-dev-native-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pet-native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic native bundle and auto-facet safeguards
        run: node LYVRA_PET/verify-native-auto-facet-dev.mjs
      - name: Verify repository approvals and genuine Ed25519 signatures
        run: node LYVRA_PET/bridge/verify-repository-events.mjs
      - name: Verify native refresh and cooldown guards
        run: node LYVRA_PET/bridge/verify-native-refresh.mjs
