name: LYVRA Worker v2.1 Hardening Tests
on:
  push:
    branches:
      - worker-v2-hardening-2-1-dev-20261005
      - worker-v2-main-system-authority
    paths:
      - "cloudflare-workers/personal-main-system-authority/**"
      - ".github/workflows/worker-v2-hardening-2-1-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ""
      CLOUDFLARE_ACCOUNT_ID: ""
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < cloudflare-workers/personal-main-system-authority/worker.js
          node --input-type=module --check < cloudflare-workers/personal-main-system-authority/worker-runtime-adapter.js
      - name: v2.1 hardening regression
        run: node --test cloudflare-workers/personal-main-system-authority/worker-v2-hardening.test.mjs
      - name: Build current v2.1 Worker with Wrangler without deployment
        run: |
          set -euo pipefail
          cd cloudflare-workers/personal-main-system-authority
          npx --yes wrangler@4.111.0 deploy --dry-run --outdir=/tmp/lyvra-v2-1-build
          test -d /tmp/lyvra-v2-1-build
          test -n "$(find /tmp/lyvra-v2-1-build -type f -print -quit)"
          echo "V2_1_WRANGLER_DRY_RUN=PASS; DEPLOYMENT=FALSE"

      - name: Assert no v3 or stateful storage dependency
        run: |
          set -euo pipefail
          ! grep -R -E "NATIVE_V3|worker-v3|durable_objects|new_sqlite_classes|NATIVE_V3_NONCES"             cloudflare-workers/personal-main-system-authority/worker.js             cloudflare-workers/personal-main-system-authority/worker-runtime-adapter.js             cloudflare-workers/personal-main-system-authority/wrangler.toml
          echo "V2_STATELESS_NO_SQLITE_NO_DURABLE_OBJECT=PASS"
