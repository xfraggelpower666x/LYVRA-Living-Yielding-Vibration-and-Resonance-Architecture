name: LYVRA CodeForge Bot Return Readonly CI
on:
  push:
    branches: [lyvra]
    paths:
      - 'LYVRA_NATIVE_RUNTIME/continuity/development_exchange/bot_return_probe.py'
      - 'LYVRA_NATIVE_RUNTIME/continuity/development_exchange/test_bot_return_probe.py'
      - '.github/workflows/codeforge-bot-return-readonly-ci.yml'
  workflow_dispatch:
  schedule:
    - cron: '13 */6 * * *'
permissions:
  contents: read
concurrency:
  group: lyvra-codeforge-bot-return-readonly
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test without writes
        run: |
          python -m py_compile LYVRA_NATIVE_RUNTIME/continuity/development_exchange/bot_return_probe.py
          python -m unittest -v LYVRA_NATIVE_RUNTIME/continuity/development_exchange/test_bot_return_probe.py
      - name: Read bot DEV return via pinned GitHub source
        env:
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python LYVRA_NATIVE_RUNTIME/continuity/development_exchange/bot_return_probe.py | tee /tmp/lyvra-bot-return.json
          python - <<'PY'
          import json, os
          with open('/tmp/lyvra-bot-return.json', encoding='utf-8') as f:
              r = json.load(f)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Bot → LYVRA CodeForge · read-only observation\n')
              for k in ('event_id', 'status', 'bot_source_head', 'outbox_git_blob'):
                  f.write(f'- {k}: `{r[k]}`\n')
              f.write('- ACK: **not issued**; native learning: **not adopted**\n')
          PY
