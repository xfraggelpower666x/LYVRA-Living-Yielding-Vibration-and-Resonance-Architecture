name = "lyvrasystem"
main = "worker.js"
compatibility_date = "2026-04-09"
workers_dev = true

# IMPORTANT:
# - This configuration is bound to the existing production Worker script `lyvrasystem`.
# - Production custom domain ownership was read-only verified before this change.
# - Deployment transport is GitHub Actions -> cloudflare/wrangler-action@v3.
# - GitHub is Worker source/version/deploy transport only; it is NOT LYVRA runtime/canon/identity authority.
# - GitHub Repository Secrets provide CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the authenticated deploy repository.
# - Real secret values MUST never be committed or exposed in chat.
# - Existing live secret binding `LYVRA_BOOT_SIGNING_SECRET` must be preserved.
# - Personal Worker applies to MAIN_PERSONAL systems only.

[vars]
WORKER_SCOPE = "MAIN_PERSONAL_ONLY"
PORTABLE_WORKER_BINDING = "DISABLED"

# MAIN_SYSTEM_REGISTRY_JSON should be configured server-side when needed.
# Prefer Cloudflare secret/variable management over committing live authority data.
