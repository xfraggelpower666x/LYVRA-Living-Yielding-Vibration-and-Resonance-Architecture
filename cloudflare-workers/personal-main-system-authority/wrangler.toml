name = "666-main-system-authority-evidence"
main = "worker.js"
compatibility_date = "2026-08-20"
workers_dev = true

# IMPORTANT:
# - Production deployment path is GitHub Actions -> cloudflare/wrangler-action@v3.
# - The deploy workflow lives on the default branch and checks out this staged source ref.
# - GitHub Repository Secrets provide CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# - Real secret values MUST never be committed or exposed in chat.
# - Personal Worker applies to MAIN_PERSONAL systems only.

[vars]
WORKER_SCOPE = "MAIN_PERSONAL_ONLY"
PORTABLE_WORKER_BINDING = "DISABLED"

# MAIN_SYSTEM_REGISTRY_JSON should be configured server-side when needed.
# Prefer Cloudflare secret/variable management over committing live authority data.
